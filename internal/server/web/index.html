<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Relay</title>
  <meta name="description" content="Relay — a concurrent, work-stealing job runtime for logistics operations.">
  <meta name="theme-color" content="#0a0a0b">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('relay-theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themePref = pref;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d4fd8'/%3E%3Cpath d='M9 22V10h7a4 4 0 0 1 0 8h-7m7 0 5 4' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" aria-busy="true">
    <div class="boot" role="status"><span class="spinner" aria-hidden="true"></span><span>Loading Relay…</span></div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <noscript><p class="noscript">Relay needs JavaScript to run.</p></noscript>
</body>
</html>
